<!-- POPUP 1 -->
<div id="popup1" class="surprise-popup">
    <div class="popup-box">
        <div class="popup-text">
            I have one more little thing to show you... ❤️
        </div>
        <button onclick="nextPopup(1)">Continue</button>
    </div>
</div>

<!-- POPUP 2 -->
<div id="popup2" class="surprise-popup">
    <div class="popup-box">
        <div class="popup-text">
            So... before this little journey ends,
            <br><br>
            there's something I made just for you. 🤍
        </div>
        <button onclick="showVideo()">One last thing...</button>
    </div>
</div>

<!-- VIDEO -->
<div id="videoScreen">
    <video id="birthdayVideo" controls playsinline>
        <source src="birthday-video.mp4" type="video/mp4">
        Your browser does not support video playback.
    </video>
</div>

<style>
.surprise-popup {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.82);
    backdrop-filter: blur(8px);
}

.popup-box {
    width: min(90%, 430px);
    padding: 35px 25px;
    text-align: center;
    background: rgba(20,20,20,0.96);
    border: 1px solid rgba(255,255,255,0.2);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    animation: popupIn 0.5s ease;
}

.popup-text {
    color: white;
    font-size: 20px;
    line-height: 1.6;
    margin-bottom: 28px;
}

.popup-box button {
    padding: 12px 28px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #111;
    font-size: 15px;
    cursor: pointer;
}

#videoScreen {
    position: fixed;
    inset: 0;
    z-index: 10000;
    display: none;
    align-items: center;
    justify-content: center;
    background: black;
}

#birthdayVideo {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

@keyframes popupIn {
    from {
        opacity: 0;
        transform: scale(0.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>

<script>
function startFinalSurprise() {
    document.getElementById("popup1").style.display = "flex";
}

function nextPopup(num) {
    if (num === 1) {
        document.getElementById("popup1").style.display = "none";
        document.getElementById("popup2").style.display = "flex";
    }
}

function showVideo() {
    document.getElementById("popup2").style.display = "none";

    const screen = document.getElementById("videoScreen");
    const video = document.getElementById("birthdayVideo");

    screen.style.display = "flex";

    video.currentTime = 0;
    video.play().catch(() => {
        // Browser may require the user to press play
    });
}
</script>
